services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: X5MZSBAwBv0X
      POSTGRES_DB: desk_booking_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Containerfile
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORS_ORIGIN=http://localhost:4200
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=X5MZSBAwBv0X
      - DB_NAME=desk_booking_db
      - JWT_SECRET=NUFISDHG865476YG3U87YTGFDBG87DIFGT8HRGDFYG
      - JWT_EXPIRES_IN=1d
    volumes:
      - ./Backend/src:/app/src
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./Frontend
      dockerfile: Containerfile
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    ports:
      - "4200:4200"
    volumes:
      - ./Frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
  db_data:
