services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORS_ORIGIN=http://localhost:4200
    volumes:
      - ./src:/app/src
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
