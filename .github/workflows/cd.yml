name: CD

permissions:
  contents: write

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  promote-to-main:
    name: Promote dev → main
    runs-on: ubuntu-latest
    # only run when CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git fetch origin main dev
          git checkout -B main origin/main
          git merge --no-ff --no-edit origin/dev
          git push origin main

  run-ai-agent:
    name: Run AI Agent
    runs-on: ubuntu-latest
    needs: promote-to-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/ai-agents/package-lock.json

      - name: Install AI agent dependencies
        working-directory: Backend/ai-agents
        run: npm ci

      - name: Run AI agent
        working-directory: Backend/ai-agents
        env:
          GENAIPLATFORM_FARM_SUBSCRIPTION_KEY: ${{ secrets.GENAIPLATFORM_FARM_SUBSCRIPTION_KEY }}
        run: node index.js
