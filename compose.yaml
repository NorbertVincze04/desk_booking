services:
  backend:
    build:
      context: ./Backend
      dockerfile: Containerfile
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORS_ORIGIN=http://localhost:4200
      - ENABLE_TUNNEL=false
    volumes:
      - ./Backend/src:/app/src
      - backend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./Frontend
      dockerfile: Containerfile
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    ports:
      - "4200:4200"
    volumes:
      - ./Frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
