name: CD

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  promote-to-main:
    name: Promote dev → main
    runs-on: ubuntu-latest
    # For workflow_run: only promote when CI succeeded on push to dev.
    # For manual runs: allow execution via workflow_dispatch for debugging.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git fetch origin main dev
          git checkout -B main origin/main
          git merge --no-ff --no-edit origin/dev
          git push origin main
