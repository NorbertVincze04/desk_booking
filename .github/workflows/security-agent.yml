name: Security Agent

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read
  security-events: write # upload CodeQL SARIF to GitHub Security tab
  pull-requests: write   # post PR comments
  issues: write          # open security issues on scheduled runs
  models: read           # GitHub Models API access

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — CodeQL (AI-powered SAST by GitHub)
  # ─────────────────────────────────────────────
  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds extra CWE/OWASP rule packs
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Results are automatically uploaded to the GitHub Security tab

  # ─────────────────────────────────────────────
  # JOB 2 — npm Dependency Audit
  # ─────────────────────────────────────────────
  dependency-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Audit Frontend dependencies
        working-directory: Frontend
        run: |
          npm ci --prefer-offline
          # Exit code ≠ 0 when vulnerabilities exist — capture output, don't fail here
          npm audit --json > ../frontend-audit.json 2>/dev/null || true

      - name: Audit Backend dependencies
        working-directory: Backend
        run: |
          npm ci --prefer-offline
          npm audit --json > ../backend-audit.json 2>/dev/null || true

      # ── Enrich raw audit data: classify scope/layer, detect breaking upgrades ──
      - name: Enrich audit data
        run: |
          python3 << 'PYEOF'
          import json

          def load_json(path):
              try:
                  with open(path) as f: return json.load(f)
              except: return {}

          def dev_packages(pkg_json_path):
              return set(load_json(pkg_json_path).get("devDependencies", {}).keys())

          def enrich(audit_data, dev_pkgs, scope):
              findings = []
              for name, info in audit_data.get("vulnerabilities", {}).items():
                  fix       = info.get("fixAvailable")
                  is_dev    = name in dev_pkgs
                  layer     = "dev tooling" if is_dev else "production runtime"
                  breaking  = False

                  if fix is True:
                      fix_cmd = f"npm audit fix"
                  elif isinstance(fix, dict):
                      fix_pkg  = fix.get("name", name)
                      fix_ver  = fix.get("version", "")
                      breaking = fix.get("isSemVerMajor", False)
                      safe_note = "BREAKING: semver-major — test thoroughly" if breaking else "safe upgrade"
                      fix_cmd   = f"npm install {fix_pkg}@{fix_ver}  # {safe_note}"
                  else:
                      fix_cmd = "No automated fix — review manually"

                  findings.append({
                      "package":          name,
                      "scope":            scope,
                      "layer":            layer,
                      "severity":         info.get("severity"),
                      "via":              [v if isinstance(v, str) else v.get("title", "") for v in info.get("via", [])[:3]],
                      "fixCmd":           fix_cmd,
                      "isBreakingUpgrade": breaking
                  })

              return {
                  "scope":           scope,
                  "metadata":        audit_data.get("metadata", {}),
                  "vulnerabilities": findings
              }

          fe_enriched = enrich(load_json("frontend-audit.json"), dev_packages("Frontend/package.json"), "Frontend")
          be_enriched = enrich(load_json("backend-audit.json"),  dev_packages("Backend/package.json"),  "Backend")

          with open("frontend-enriched.json", "w") as f: json.dump(fe_enriched, f, indent=2)
          with open("backend-enriched.json",  "w") as f: json.dump(be_enriched, f, indent=2)
          print("Enrichment complete.")
          PYEOF

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            frontend-audit.json
            backend-audit.json
            frontend-enriched.json
            backend-enriched.json

  # ─────────────────────────────────────────────
  # JOB 3 — Trivy Filesystem Scan
  # ─────────────────────────────────────────────
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy (HIGH + CRITICAL only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: "."
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "0" # Don't fail the job; AI agent will interpret results

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json

  # ─────────────────────────────────────────────
  # JOB 4 — AI Security Agent (GitHub Models)
  # ─────────────────────────────────────────────
  ai-security-report:
    name: AI Security Report
    runs-on: ubuntu-latest
    needs: [dependency-audit, trivy-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download audit results
        uses: actions/download-artifact@v4
        with:
          name: audit-results
          path: scan-results/

      - name: Download Trivy results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: scan-results/

      - name: Run AI Security Agent
        id: ai-analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from urllib import request as urllib_request

          def load_json(path):
              try:
                  with open(path) as f: return json.load(f)
              except: return {}

          # ── Load enriched audit data + Trivy ──────────────────────────────
          fe = load_json("scan-results/frontend-enriched.json")
          be = load_json("scan-results/backend-enriched.json")
          trivy = load_json("scan-results/trivy-results.json")

          def condense_enriched(data):
              scope = data.get("scope", "Unknown")
              vulns = data.get("vulnerabilities", [])
              counts = {"critical": 0, "high": 0, "moderate": 0, "low": 0}
              for v in vulns:
                  sev = v.get("severity", "low")
                  counts[sev] = counts.get(sev, 0) + 1
              top = [
                  {
                      "package":          v["package"],
                      "scope":            v["scope"],
                      "layer":            v["layer"],
                      "severity":         v["severity"],
                      "via":              v.get("via", []),
                      "fixCmd":           v["fixCmd"],
                      "isBreakingUpgrade": v["isBreakingUpgrade"]
                  }
                  for v in vulns if v.get("severity") in ("critical", "high")
              ][:20]
              return {"scope": scope, "counts": counts, "criticalAndHighFindings": top}

          def condense_trivy(data):
              findings = []
              for r in data.get("Results", []):
                  for v in r.get("Vulnerabilities", [])[:15]:
                      findings.append({
                          "pkg":              v.get("PkgName"),
                          "cve":              v.get("VulnerabilityID"),
                          "severity":         v.get("Severity"),
                          "installedVersion": v.get("InstalledVersion"),
                          "fixedVersion":     v.get("FixedVersion"),
                          "title":            v.get("Title", "")[:120]
                      })
              return {"source": "Trivy", "findings": findings}

          scan_data = {
              "repository": os.environ.get("REPO_NAME"),
              "branch":     os.environ.get("BRANCH"),
              "commit":     os.environ.get("COMMIT_SHA", "")[:10],
              "scans": [
                  condense_enriched(fe),
                  condense_enriched(be),
                  condense_trivy(trivy)
              ]
          }
          scan_json = json.dumps(scan_data, indent=2)

          # ── Build prompt ───────────────────────────────────────────────────
          prompt = f"""You are a security AI agent reviewing vulnerability scan results for a desk reservation web app (Node.js/Express + JWT/bcrypt backend, Angular frontend).

Each npm finding includes:
- `scope`: Frontend or Backend
- `layer`: production runtime OR dev tooling
- `fixCmd`: the exact safe fix command (already computed)
- `isBreakingUpgrade`: true when the fix requires a semver-major bump

Your tasks:
1. List all **Critical** and **High** findings. For each, state: package, scope, layer, severity, and the safe fix command verbatim from `fixCmd`.
2. For every entry where `isBreakingUpgrade` is true, add a prominent warning block explaining what might break and that the developer should pin the current version while testing.
3. Explain whether each finding is in **production runtime** (ships to users) or **dev tooling** (build/test only) — and adjust urgency accordingly.
4. Flag any auth/JWT/bcrypt/crypto-related findings with a dedicated section.
5. Provide an **Overall Security Score** (0–10).
6. End with a prioritised **Remediation Plan** (run these commands, in this order).

Do NOT suggest `npm audit fix --force` as a blanket command. Always use the specific `fixCmd` from the scan data.

Respond in clean Markdown:
## Security Agent Report
### Summary
### Critical & High Vulnerabilities
### Breaking Upgrade Warnings
### Auth & Crypto Findings
### Overall Security Score
### Remediation Plan (ordered commands)

Scan Data:
```json
{scan_json}
```"""

          # ── Call GitHub Models API ─────────────────────────────────────────
          payload = json.dumps({
              "model": "gpt-4o",
              "messages": [
                  {"role": "system", "content": "You are a cybersecurity expert AI agent for Node.js/Angular apps. Be precise, use the exact fix commands from the scan data, and never suggest blanket force-upgrades."},
                  {"role": "user",   "content": prompt}
              ],
              "max_tokens": 2000,
              "temperature": 0.1
          }).encode()

          req = urllib_request.Request(
              "https://models.inference.ai.azure.com/chat/completions",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"
              }
          )

          try:
              with urllib_request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read().decode())
                  ai_report = data["choices"][0]["message"]["content"]
          except Exception as e:
              # Graceful fallback: format the raw enriched data as a readable report
              lines = ["## Security Agent Report", "", f"> ⚠️ AI analysis unavailable: `{e}`", ""]
              for src in scan_data["scans"]:
                  scope = src.get("scope", src.get("source", "Unknown"))
                  lines.append(f"### {scope}")
                  for v in src.get("criticalAndHighFindings", src.get("findings", [])):
                      sev  = v.get("severity", v.get("Severity", "")).upper()
                      pkg  = v.get("package", v.get("pkg", ""))
                      cmd  = v.get("fixCmd", "See Trivy artifact")
                      brk  = " ⚠️ BREAKING" if v.get("isBreakingUpgrade") else ""
                      lines.append(f"- **{sev}** `{pkg}`{brk} — `{cmd}`")
                  lines.append("")
              ai_report = "\n".join(lines)

          header = (
              f"<!-- security-agent-report -->\n"
              f"> **Security Agent** | `{os.environ.get('REPO_NAME')}` | "
              f"branch: `{os.environ.get('BRANCH')}` | "
              f"commit: `{os.environ.get('COMMIT_SHA','')[:10]}`\n\n"
          )

          with open("security-report.md", "w") as f:
              f.write(header + ai_report)

          print(ai_report)
          PYEOF

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 90

      # Post as PR comment
      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');

            // Find existing security-agent comment and update it (avoids spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.body.includes('<!-- security-agent-report -->') &&
              c.user.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      # Create one tracking issue per high/critical vulnerability (on push, deduplicated)
      - name: Create Tracking Issues for High/Critical Findings
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function loadJson(path) {
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return {}; }
            }

            const fe = loadJson('scan-results/frontend-enriched.json');
            const be = loadJson('scan-results/backend-enriched.json');
            const allVulns = [
              ...(fe.vulnerabilities || []),
              ...(be.vulnerabilities || [])
            ].filter(v => v.severity === 'critical' || v.severity === 'high');

            if (allVulns.length === 0) {
              console.log('No high/critical vulnerabilities — no issues to create.');
              return;
            }

            // Fetch open security issues to deduplicate
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100
            });
            const openTitles = new Set(openIssues.map(i => i.title));

            for (const v of allVulns) {
              const title = `[Security] ${v.severity.toUpperCase()}: ${v.package} (${v.scope} — ${v.layer})`;
              if (openTitles.has(title)) {
                console.log(`Skipping duplicate: ${title}`);
                continue;
              }

              const breakingBlock = v.isBreakingUpgrade ? [
                `> ⚠️ **Breaking Upgrade Warning**`,
                `> This fix requires a **semver-major version bump**. Running it may introduce breaking changes.`,
                `> - Pin the current version in CI while testing in a branch first.`,
                `> - Review the package changelog before merging.`,
                ``
              ].join('\n') : '';

              const layerNote = v.layer === 'dev tooling'
                ? '_This package is a **dev dependency** — it does not ship to production. Urgency is lower, but should still be tracked._'
                : '_This package is a **production runtime** dependency — it is shipped to end users. Prioritise this fix._';

              const body = [
                `<!-- security-tracking-issue: ${v.package} -->`,
                `## ${v.severity.toUpperCase()} Vulnerability: \`${v.package}\``,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Scope** | ${v.scope} |`,
                `| **Layer** | ${v.layer} |`,
                `| **Severity** | ${v.severity} |`,
                `| **Via** | ${(v.via || []).join(', ') || 'direct dependency'} |`,
                ``,
                layerNote,
                ``,
                breakingBlock,
                `### Safe Fix Command`,
                `\`\`\`bash`,
                `cd ${v.scope}`,
                v.fixCmd,
                `\`\`\``,
                ``,
                `_Detected on commit \`${context.sha.substring(0, 10)}\` · branch \`${context.ref.replace('refs/heads/', '')}\`_`
              ].join('\n');

              const labels = ['security', v.severity === 'critical' ? 'critical' : 'high-priority'];
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels
              });
              console.log(`Created: ${title}`);
            }

  # ─────────────────────────────────────────────
  # JOB 5 — Gate: fail CI if critical vulns found
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-audit, trivy-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download audit results
        uses: actions/download-artifact@v4
        with:
          name: audit-results
          path: scan-results/

      - name: Download Trivy results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: scan-results/

      - name: Evaluate security gate
        run: |
          python3 << 'PYEOF'
          import json, sys

          def load_json(path):
              try:
                  with open(path) as f: return json.load(f)
              except: return {}

          failed = False

          for label, path in [("Frontend", "scan-results/frontend-audit.json"), ("Backend", "scan-results/backend-audit.json")]:
              data = load_json(path)
              vulns = data.get("vulnerabilities", {})
              criticals = [n for n, v in vulns.items() if v.get("severity") == "critical"]
              if criticals:
                  print(f"❌ GATE FAILED — {label} has {len(criticals)} critical npm vulnerabilities: {criticals}")
                  failed = True
              else:
                  print(f"✅ {label}: no critical npm vulnerabilities")

          trivy = load_json("scan-results/trivy-results.json")
          crit_cves = []
          for r in trivy.get("Results", []):
              for v in r.get("Vulnerabilities", []):
                  if v.get("Severity") == "CRITICAL":
                      crit_cves.append(v.get("VulnerabilityID"))
          if crit_cves:
              print(f"❌ GATE FAILED — Trivy found {len(crit_cves)} critical CVEs: {crit_cves[:10]}")
              failed = True
          else:
              print("✅ Trivy: no critical CVEs detected")

          sys.exit(1 if failed else 0)
          PYEOF
