# Release/deploy stage: consumes the 'drop' artifact published by the
# test-ai-agents-CI build pipeline (azure-pipelines.yml) and runs the ai-agent
# on the CLJVM00485 Environment's registered VM resource - no separate Agent
# Pool needed, since Agent Pool registration requires org-level "Agent Pool
# Administrator" rights we don't have. Deployment jobs targeting an Environment
# run on whatever resource/agent is registered to that Environment instead.
trigger: none

resources:
  pipelines:
    - pipeline: "test-ai-agents-CI"
      project: "WebTools"
      source: "test-ai-agents-CI"
      branch: "dev"

variables:
  npmRegistry: "https://artifactory.boschdevcloud.com/artifactory/api/npm/cs-npmjs-remote/"
  http_proxy: "http://rb-proxy-sl.bosch.com:8080"
  https_proxy: "http://rb-proxy-sl.bosch.com:8080"

stages:
  - stage: RunAIAgent
    displayName: "Install dependencies and run ai-agent"
    jobs:
      - deployment: RunAgent
        displayName: "Run ai-agent on CLJVM00485"
        environment: "CLJVM00485.CLJVM00485"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: "test-ai-agents-CI"
                  name: "DownloadBuildArtifacts"
                  displayName: "Download Build Artifacts"
                  artifact: "drop"

                - download: "test-ai-agents-CI"
                  name: "DownloadBackendAppArtifacts"
                  displayName: "Download Backend App Artifacts"
                  artifact: "backend-app"

                - download: "test-ai-agents-CI"
                  name: "DownloadFrontendAppArtifacts"
                  displayName: "Download Frontend App Artifacts"
                  artifact: "frontend-app"

                # Node 20 must already be installed on the VM and on PATH.
                # We don't use the UseNode@1 task here because it needs to
                # download the Node binary from the public internet
                # (nodejs.org), and the corporate proxy rejects that
                # tunnel (403) for this agent - only internal Bosch hosts
                # (artifactory/AI Farm) are reachable through it.
                - powershell: node --version
                  displayName: "Verify Node.js is installed"

                - powershell: |
                    "registry=$(npmRegistry)" | Out-File -FilePath .npmrc -Encoding ascii
                    if ($env:NPM_AUTH_TOKEN) {
                      "//artifactory.boschdevcloud.com/artifactory/api/npm/cs-npmjs-remote/:_authToken=$env:NPM_AUTH_TOKEN" | Out-File -FilePath .npmrc -Append -Encoding ascii
                    }
                  workingDirectory: "$(Pipeline.Workspace)/test-ai-agents-CI/drop"
                  displayName: "Configure npm registry"
                  env:
                    NPM_AUTH_TOKEN: $(NPM_AUTH_TOKEN)

                - powershell: |
                    $appPaths = @(
                      "$(Pipeline.Workspace)/test-ai-agents-CI/backend-app",
                      "$(Pipeline.Workspace)/test-ai-agents-CI/frontend-app"
                    )

                    foreach ($appPath in $appPaths) {
                      "registry=$(npmRegistry)" | Out-File -FilePath "$appPath/.npmrc" -Encoding ascii
                      if ($env:NPM_AUTH_TOKEN) {
                        "//artifactory.boschdevcloud.com/artifactory/api/npm/cs-npmjs-remote/:_authToken=$env:NPM_AUTH_TOKEN" | Out-File -FilePath "$appPath/.npmrc" -Append -Encoding ascii
                      }
                    }
                  displayName: "Configure npm registry for app artifacts"
                  env:
                    NPM_AUTH_TOKEN: $(NPM_AUTH_TOKEN)

                - script: npm ci
                  workingDirectory: "$(Pipeline.Workspace)/test-ai-agents-CI/drop"
                  displayName: "Install dependencies"

                - powershell: |
                    New-Item -ItemType Directory -Force -Path "$(Pipeline.Workspace)/test-ai-agents-CI/drop/reports" | Out-Null
                  displayName: "Create reports directory"

                - script: npm ci --no-audit
                  workingDirectory: "$(Pipeline.Workspace)/test-ai-agents-CI/backend-app"
                  displayName: "Install backend dependencies"

                - powershell: |
                    $auditOutput = npm audit --json 2>&1
                    $auditExitCode = $LASTEXITCODE
                    $auditOutput | Out-File -FilePath "$(Pipeline.Workspace)/test-ai-agents-CI/drop/reports/backend-audit.json" -Encoding utf8
                    if ($auditExitCode -ne 0) {
                      Write-Host "npm audit (backend) returned exit code $auditExitCode (vulnerabilities may be present); continuing with generated report."
                    }
                    exit 0
                  workingDirectory: "$(Pipeline.Workspace)/test-ai-agents-CI/backend-app"
                  displayName: "Generate backend npm audit report"

                - script: npm ci --no-audit
                  workingDirectory: "$(Pipeline.Workspace)/test-ai-agents-CI/frontend-app"
                  displayName: "Install frontend dependencies"

                - powershell: |
                    $auditOutput = npm audit --json 2>&1
                    $auditExitCode = $LASTEXITCODE
                    $auditOutput | Out-File -FilePath "$(Pipeline.Workspace)/test-ai-agents-CI/drop/reports/frontend-audit.json" -Encoding utf8
                    if ($auditExitCode -ne 0) {
                      Write-Host "npm audit (frontend) returned exit code $auditExitCode (vulnerabilities may be present); continuing with generated report."
                    }
                    exit 0
                  workingDirectory: "$(Pipeline.Workspace)/test-ai-agents-CI/frontend-app"
                  displayName: "Generate frontend npm audit report"

                - powershell: |
                    $backendPkgPath = "$(Pipeline.Workspace)/test-ai-agents-CI/backend-app/package.json"
                    $frontendPkgPath = "$(Pipeline.Workspace)/test-ai-agents-CI/frontend-app/package.json"
                    $outputPath = "$(Pipeline.Workspace)/test-ai-agents-CI/drop/reports/dependency-changes.txt"

                    $backendPkg = Get-Content -Raw -Path $backendPkgPath | ConvertFrom-Json
                    $frontendPkg = Get-Content -Raw -Path $frontendPkgPath | ConvertFrom-Json

                    $lines = @()
                    $lines += "Dependency baseline snapshot generated at $(Get-Date -Format o)."
                    $lines += ""
                    $lines += "Backend dependencies:"
                    if ($backendPkg.dependencies) {
                      foreach ($prop in $backendPkg.dependencies.PSObject.Properties | Sort-Object Name) {
                        $lines += "$($prop.Name): $($prop.Value)"
                      }
                    } else {
                      $lines += "(none)"
                    }

                    $lines += ""
                    $lines += "Frontend dependencies:"
                    if ($frontendPkg.dependencies) {
                      foreach ($prop in $frontendPkg.dependencies.PSObject.Properties | Sort-Object Name) {
                        $lines += "$($prop.Name): $($prop.Value)"
                      }
                    } else {
                      $lines += "(none)"
                    }

                    $lines | Out-File -FilePath $outputPath -Encoding utf8
                  displayName: "Generate dependency context file"

                - script: node index.js
                  workingDirectory: "$(Pipeline.Workspace)/test-ai-agents-CI/drop"
                  displayName: "Run ai-agent"
                  env:
                    GENAIPLATFORM_FARM_SUBSCRIPTION_KEY: $(GENAIPLATFORM_FARM_SUBSCRIPTION_KEY)

                - task: PublishBuildArtifacts@1
                  displayName: "Publish AI security report artifact"
                  inputs:
                    PathtoPublish: "$(Pipeline.Workspace)/test-ai-agents-CI/drop/reports"
                    ArtifactName: "ai-security-reports"
                    publishLocation: "Container"
